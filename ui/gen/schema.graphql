    """id of an area; matches documents that link to it"""
    area: String
    """skip the meaning search: nothing leaves this machine"""
    exact_only: Boolean
    limit: Int
    """the last word matches the start of a word, for a search box that runs as a person types"""
    prefix: Boolean
    """id of a project; matches documents that link to it"""
    project: String
    query: String!
    """updated on or after this date (YYYY-MM-DD), or within a span such as 7d or 2w"""
    since: String
    """document status, such as todo or active; open means any status that is not final"""
    status: String
    """document type, such as task, project, note, policy"""
    type: String
  ): para_SearchOutput @derived(operationId: "search")
  similar(title: String!, type: para_similarType!): para_SimilarOutput @derived(operationId: "similar")
